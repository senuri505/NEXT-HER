<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 650" width="100%" height="100%">
  <defs>
    <!-- Multi-Layer Purple Family Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E6FA" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#C8A2C8" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#9966CC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4B0082" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#4B0082"/>
      <stop offset="100%" stop-color="#2D0052"/>
    </linearGradient>

    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#7F00FF" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Ambient Glowing Backdrop -->
  <circle cx="325" cy="325" r="270" fill="url(#bgGlow)" filter="url(#blurFilter)" />

  <!-- Main NEXT HER Circular Shield Emblem (Centered) -->
  <g transform="translate(150, 150)" filter="url(#softShadow)">
    <!-- Shield Outer Boundary -->
    <circle cx="175" cy="175" r="165" fill="#FFFFFF" stroke="url(#shieldGrad)" stroke-width="7"/>
    <circle cx="175" cy="175" r="150" fill="none" stroke="#C8A2C8" stroke-width="2.5" stroke-dasharray="8,5"/>

    <!-- Tech Woman Profile in Shield -->
    <g transform="translate(72, 62)">
      <!-- Face Profile Silhouette -->
      <path d="M 115 50 C 130 50 148 62 148 82 C 148 95 136 104 130 114 C 125 122 132 130 140 135 C 148 140 155 150 148 165 C 138 180 122 188 114 200 C 103 192 98 175 100 162 C 95 150 83 142 77 125 C 70 108 85 88 102 71 Z" fill="url(#shieldGrad)"/>

      <!-- Circuit Traces in Hair -->
      <path d="M 96 56 C 60 50 36 76 24 114 C 17 140 12 178 7 204" stroke="#9966CC" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 84 46 C 40 46 16 72 -1 107 C -8 132 -13 165 -18 191" stroke="#7F00FF" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 102 38 C 60 30 36 46 18 71 C 6 89 -4 122 -9 153" stroke="#C8A2C8" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Circuit Nodes -->
      <circle cx="24" cy="114" r="6" fill="#9966CC"/>
      <circle cx="-1" cy="107" r="5.5" fill="#7F00FF"/>
      <circle cx="7" cy="204" r="6" fill="#4B0082"/>
      <circle cx="-18" cy="191" r="5" fill="#9966CC"/>
      <circle cx="18" cy="71" r="4.5" fill="#C8A2C8"/>
    </g>
  </g>
</svg>
