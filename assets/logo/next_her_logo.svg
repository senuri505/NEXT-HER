<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#4B0082"/>
      <stop offset="100%" stop-color="#360061"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966CC"/>
      <stop offset="100%" stop-color="#4B0082"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Icon Emblem Group -->
  <g transform="translate(45, 10)">
    <!-- Outer Shield / Circle Ring -->
    <path d="M 50 5 C 90 5 105 25 105 60 C 105 95 85 115 50 115 C 15 115 -5 95 -5 60 C -5 25 10 5 50 5 Z" fill="none" stroke="url(#shieldGradient)" stroke-width="4.5" />
    <path d="M 50 0 C 95 0 112 22 112 60 C 112 98 90 120 50 120 C 10 120 -12 98 -12 60 C -12 22 5 0 50 0 Z" fill="none" stroke="#C8A2C8" stroke-width="1.5" opacity="0.6"/>

    <!-- Woman Profile Silhouette -->
    <g transform="translate(15, 15)">
      <!-- Face & Neck Profile -->
      <path d="M 42 20 C 48 20 55 24 55 30 C 55 35 50 38 48 42 C 46 45 49 48 52 50 C 55 52 58 56 55 62 C 51 68 45 70 42 75 C 38 72 36 65 37 60 C 35 55 30 52 28 45 C 26 38 32 30 38 24 Z" fill="url(#purpleGradient)"/>
      
      <!-- Circuit Lines in Hair -->
      <path d="M 35 22 C 20 20 10 30 5 45 C 2 55 0 70 -2 80" fill="none" stroke="#9966CC" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 30 18 C 12 18 2 28 -5 42 C -8 52 -10 65 -12 75" fill="none" stroke="#7F00FF" stroke-width="2" stroke-linecap="round"/>
      <path d="M 38 15 C 22 12 12 18 5 28 C 0 35 -4 48 -6 60" fill="none" stroke="#C8A2C8" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Circuit Nodes -->
      <circle cx="5" cy="45" r="3" fill="#9966CC"/>
      <circle cx="-5" cy="42" r="2.5" fill="#7F00FF"/>
      <circle cx="-2" cy="80" r="3" fill="#4B0082"/>
      <circle cx="-12" cy="75" r="2.5" fill="#9966CC"/>
      <circle cx="5" cy="28" r="2" fill="#C8A2C8"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(185, 80)">
    <!-- NEXT HER -->
    <text x="0" y="25" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#360061" letter-spacing="4">NEXT <tspan fill="#7F00FF">HER</tspan></text>

    <!-- Subtitle Line -->
    <line x1="0" y1="42" x2="280" y2="42" stroke="#B784A7" stroke-width="1.5"/>
    <text x="140" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#4B0082" text-anchor="middle" letter-spacing="2.5">EMPOWERING HER IN THE DIGITAL WORLD</text>
    <line x1="0" y1="64" x2="280" y2="64" stroke="#B784A7" stroke-width="1.5"/>
  </g>
</svg>
